<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine El Hammdaoui – Skills</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/skills/skills.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <script src="/general/header/header-loader.js"></script>

    <main>
        <h1>My Skills</h1>
        <section class="skill-grid" aria-label="Core skills">
            <a class="skill-card card-mechanics" href="/skills/game-mechanics/">
                <video class="skill-card__media" autoplay muted loop playsinline aria-hidden="true">
                    <source src="/skills/game-mechanics/my-core-mechanics/hairdryer.mp4" type="video/mp4">
                </video>
                <div class="skill-card__content">
                    <h2>Game Mechanics</h2>
                </div>
            </a>

            <a class="skill-card card-feel" href="/skills/game-feel/" style="--card-visual: url('/skills/game-feel/doomed.gif');">
                <div class="skill-card__content">
                    <h2>Game Feel</h2>
                </div>
            </a>

            <a class="skill-card card-architecture" href="/skills/system-architecture/" style="--card-visual: url('/skills/system-architecture/uml.png');">
                <div class="skill-card__content">
                    <h2>System Architecture</h2>
                </div>
            </a>

            <a class="skill-card card-graphics" href="/skills/game-graphics/" style="--card-visual: url('/skills/game-graphics/cube.gif');">
                <div class="skill-card__content">
                    <h2>Game Graphics</h2>
                </div>
            </a>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/general/footer/footer-loader.js"></script>
</body>
</html>
