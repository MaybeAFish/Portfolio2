<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine El Hammdaoui – Skills</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/skills/skills.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <script src="/general/header/header-loader.js"></script>

    <main class="skills-page">
        <h1>My Skills</h1>

        <section class="skills-banner design-banner">
            <div class="banner-content">
                <h2 class="design-h2">Game Design</h2>
                <div class="skill-links">
                    <a class="skill-card" href="/skills/game-mechanics/" data-media-type="video">
                        <video class="skill-card-media" autoplay muted loop playsinline aria-hidden="true">
                            <source src="/skills/game-mechanics/hairdryer.mp4" type="video/mp4">
                        </video>
                        <h3>Game Mechanics</h3>
                    </a>
                    <a class="skill-card" href="/skills/game-loops/" data-media-type="video">
                        <video class="skill-card-media" autoplay muted loop playsinline aria-hidden="true">
                            <source src="/skills/game-loops/samurai.mp4" type="video/mp4">
                        </video>
                        <h3>Game Loops</h3>
                    </a>
                    <a class="skill-card" href="/skills/game-feel/" style="--card-bg: url('/skills/game-feel/doomed.gif');">
                        <h3>Game Feel</h3>
                    </a>
                    <a class="skill-card" href="/skills/ux-interaction/" style="--card-bg: radial-gradient(circle at 70% 30%, rgba(68, 164, 255, 0.5), transparent 18%), linear-gradient(135deg, rgba(18, 24, 37, 0.28), rgba(18, 24, 37, 0.82)), linear-gradient(120deg, rgba(59, 87, 145, 0.95), rgba(24, 31, 46, 0.95));">
                        <h3>UI, UX & Interaction</h3>
                    </a>
                </div>
            </div>
        </section>

        <section class="skills-banner development-banner">
            <div class="banner-content">
                <h2 class="development-h2">Game Development</h2>
                <div class="skill-links">
                    <a class="skill-card" href="/skills/programming/" style="--card-bg: url('/skills/programming/programming.jpeg');">
                        <h3>Programming</h3>
                    </a>
                    <a class="skill-card" href="/skills/system-architecture/" style="--card-bg: url('/skills/system-architecture/uml.png');">
                        <h3>Code/System Architecture</h3>
                    </a>
                    <a class="skill-card" href="/skills/game-engines/" style="--card-bg: url('/skills/game-engines/unity.png');">
                        <h3>Game Engines</h3>
                    </a>
                    <a class="skill-card" href="/skills/graphics-programming/" style="--card-bg: url('/skills/graphics-programming/cube.gif');">
                        <h3>Graphics Programming</h3>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/general/footer/footer-loader.js"></script>
</body>
</html>
