<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amine El Hammdaoui – CV</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/cv/cv.css" />

</head>
<body>
  <div class="content-wrapper">
    <div id="header-placeholder"></div>
    <script src="/general/header/header-loader.js"></script>

    <h1>Curriculum Vitae</h1>

    <div class="cv-wrapper">
      <div class="cv-section">
        <h2>English Version</h2>
        <button class="fancy-button" onclick="loadPDF(this, '/cv/CV-english.pdf')">View PDF here</button>
      </div>

      <div class="cv-section">
        <h2>Dutch Version</h2>
        <button class="fancy-button" onclick="loadPDF(this, '/cv/CV-dutch.pdf')">View PDF here</button>
      </div>
    </div>
  </div>

  <script>
    function loadPDF(button, pdfUrl) {
      const container = document.createElement('div');
      container.className = 'pdf-container';
      container.innerHTML = `<iframe src="${pdfUrl}"></iframe>`;
      button.replaceWith(container);
    }
  </script>

  <div id="footer-placeholder"></div>

  <script src="/general/footer/footer-loader.js"></script>
</body>
</html>
